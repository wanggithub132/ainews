name: Daily YouTube Radar

on:
  schedule:
    # 每天 UTC 9:00 (北京时间 17:00)
    - cron: '0 9 * * *'
  # 允许手动触发
  workflow_dispatch:

# 需要写权限：运行后把去重状态 pushed_videos.json 提交回仓库
permissions:
  contents: write

jobs:
  radar-and-notify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run YouTube radar
      env:
        WEIXIN_WEBHOOK_KEY: ${{ secrets.WEIXIN_WEBHOOK_KEY }}
      run: |
        python youtube_radar.py

    - name: Commit push state
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if [ -n "$(git status --porcelain pushed_videos.json)" ]; then
          git add pushed_videos.json
          git commit -m "chore: update pushed videos state [skip ci]"
          git push
        else
          echo "No state change to commit"
        fi

    - name: Check execution status
      if: always()
      run: |
        echo "Workflow Status: ${{ job.status }}"
        echo "Execution Time: $(date)"
